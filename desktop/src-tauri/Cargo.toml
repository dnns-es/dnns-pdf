[package]
name = "dnns-pdf"
version = "0.1.0"
description = "Editor de PDF libre y gratuito. Todo se procesa en tu equipo."
authors = ["DNNS.es"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/dnns-es/dnns-pdf"
edition = "2024"
rust-version = "1.90"

[lib]
name = "dnns_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[profile.release]
# Instalador pequeño: optimizar por tamaño y quitar símbolos
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
