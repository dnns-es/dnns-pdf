<!--
Fecha: 2026-10-12
Ruta: /index.html
Página principal de DNNS PDF
Barra de herramientas, panel lateral, visor de páginas y diálogos
Notas: los textos se rellenan desde i18n (data-i18n, data-i18n-titulo, data-i18n-placeholder).
       Los elementos con data-requiere-doc se desactivan mientras no hay documento abierto.
-->
<!doctype html>
<html lang="es" data-tema="claro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f6feb">
    <meta name="description" content="Editor de PDF libre y gratuito. Todo se procesa en tu dispositivo.">
    <title>DNNS PDF</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
    <header class="barra" role="toolbar">
        <div class="barra__grupo">
            <button id="boton-panel" class="boton-icono" type="button" data-i18n-titulo="barra.panel" data-requiere-doc>
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
            </button>
            <button id="boton-abrir" class="boton-icono" type="button" data-i18n-titulo="barra.abrir">
                <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            </button>
            <input id="entrada-archivo" type="file" accept="application/pdf,.pdf" hidden>
        </div>

        <div class="barra__grupo">
            <button id="boton-anterior" class="boton-icono" type="button" data-i18n-titulo="barra.anterior" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <input id="numero-pagina" class="barra__pagina" type="text" inputmode="numeric" value="" data-i18n-titulo="barra.irA" data-requiere-doc>
            <span id="total-paginas" class="barra__total"></span>
            <button id="boton-siguiente" class="boton-icono" type="button" data-i18n-titulo="barra.siguiente" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </button>
        </div>

        <div class="barra__grupo">
            <button id="boton-alejar" class="boton-icono" type="button" data-i18n-titulo="barra.alejar" data-requiere-doc>
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M20 20l-4.5-4.5"/></svg>
            </button>
            <select id="selector-zoom" class="barra__zoom" data-i18n-titulo="barra.zoom" data-requiere-doc>
                <option value="ancho" data-i18n="zoom.ancho"></option>
                <option value="pagina" data-i18n="zoom.pagina"></option>
                <option value="0.5">50 %</option>
                <option value="0.75">75 %</option>
                <option value="1">100 %</option>
                <option value="1.25">125 %</option>
                <option value="1.5">150 %</option>
                <option value="2">200 %</option>
                <option value="3">300 %</option>
                <option value="4">400 %</option>
                <option value="libre" hidden></option>
            </select>
            <button id="boton-acercar" class="boton-icono" type="button" data-i18n-titulo="barra.acercar" data-requiere-doc>
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M20 20l-4.5-4.5"/></svg>
            </button>
        </div>

        <div class="barra__grupo barra__grupo--final">
            <button id="boton-buscar" class="boton-icono" type="button" data-i18n-titulo="barra.buscar" data-requiere-doc>
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            </button>
            <button id="boton-imprimir" class="boton-icono" type="button" data-i18n-titulo="barra.imprimir" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7"/></svg>
            </button>
            <button id="boton-descargar" class="boton-icono" type="button" data-i18n-titulo="barra.descargar" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
            </button>
            <button id="boton-tema" class="boton-icono" type="button" data-i18n-titulo="barra.tema">
                <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            </button>
            <select id="selector-idioma" class="barra__idioma" aria-label="Idioma / Language">
                <option value="es">ES</option>
                <option value="en">EN</option>
            </select>
        </div>
    </header>

    <div id="barra-busqueda" class="busqueda" hidden>
        <input id="texto-busqueda" type="search" data-i18n-placeholder="busqueda.placeholder" data-i18n-titulo="busqueda.placeholder">
        <span id="contador-busqueda" class="busqueda__contador" aria-live="polite"></span>
        <button id="busqueda-anterior" class="boton-icono" type="button" data-i18n-titulo="busqueda.anterior">
            <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <button id="busqueda-siguiente" class="boton-icono" type="button" data-i18n-titulo="busqueda.siguiente">
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button id="busqueda-cerrar" class="boton-icono" type="button" data-i18n-titulo="busqueda.cerrar">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
    </div>

    <div class="cuerpo">
        <aside id="panel-lateral" class="panel" hidden>
            <div class="panel__pestanas" role="tablist">
                <button id="pestana-miniaturas" class="panel__pestana" type="button" role="tab" aria-selected="true" data-i18n="panel.miniaturas"></button>
                <button id="pestana-indice" class="panel__pestana" type="button" role="tab" aria-selected="false" data-i18n="panel.indice"></button>
            </div>
            <div id="lista-miniaturas" class="panel__contenido miniaturas" role="tabpanel"></div>
            <div id="lista-indice" class="panel__contenido indice" role="tabpanel" hidden>
                <p id="indice-vacio" class="indice__vacio" data-i18n="panel.sinIndice" hidden></p>
                <ul id="arbol-indice" class="indice__arbol"></ul>
            </div>
        </aside>

        <main id="visor" class="visor" tabindex="-1">
            <section id="portada" class="portada">
                <svg class="portada__icono" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
                <h1 data-i18n="portada.titulo"></h1>
                <p data-i18n="portada.texto"></p>
                <button id="portada-abrir" class="boton-principal" type="button" data-i18n="portada.abrir"></button>
                <p class="portada__pista" data-i18n="portada.soltar"></p>
                <p class="portada__estado">
                    <span data-i18n="motor.etiqueta"></span>
                    <strong id="estado-motor" data-i18n="motor.cargando"></strong>
                </p>
                <p class="portada__pie">
                    <span data-i18n="pie.licencia"></span> · <span id="version-app"></span>
                </p>
            </section>
            <div id="paginas" class="paginas" hidden></div>
        </main>
    </div>

    <div id="zona-soltar" class="zona-soltar" hidden>
        <p data-i18n="portada.sueltaAqui"></p>
    </div>

    <dialog id="dialogo-clave" class="dialogo">
        <form id="formulario-clave" method="dialog">
            <h2 data-i18n="clave.titulo"></h2>
            <p data-i18n="clave.texto"></p>
            <input id="campo-clave" type="password" autocomplete="off" required data-i18n-titulo="clave.titulo">
            <p id="error-clave" class="dialogo__error" data-i18n="clave.error" hidden></p>
            <div class="dialogo__botones">
                <button id="clave-cancelar" type="button" value="cancelar" data-i18n="comun.cancelar"></button>
                <button class="boton-principal" type="submit" value="aceptar" data-i18n="comun.aceptar"></button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogo-progreso" class="dialogo">
        <p id="texto-progreso"></p>
        <progress id="barra-progreso" max="1" value="0"></progress>
        <div class="dialogo__botones">
            <button id="progreso-cancelar" type="button" data-i18n="comun.cancelar"></button>
        </div>
    </dialog>

    <div id="aviso" class="aviso" role="alert" hidden></div>

    <div id="banner-actualizacion" class="banner" hidden>
        <span data-i18n="actualizacion.texto"></span>
        <button id="boton-actualizar" type="button" data-i18n="actualizacion.boton"></button>
    </div>

    <div id="zona-impresion" class="zona-impresion"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
