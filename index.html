<body>

        <div class="barra__grupo">

            </button>
            <button id="boton-descargar" class="boton-icono" type="button" data-i18n-titulo="barra.descargar" data-requiere-doc>

            </button>
            <button class="boton-icono" type="button" data-herramienta="flecha" data-i18n-titulo="anotar.herramientas.flecha">

            <select id="tamano-anotar" class="barra__zoom" data-i18n-titulo="anotar.tamano">

                <option value="24">24</option>

            <button id="boton-rehacer" class="boton-icono" type="button" data-i18n-titulo="anotar.rehacer" disabled>

    <div id="barra-busqueda" class="busqueda" hidden>

    <div class="cuerpo">
        <aside id="panel-lateral" class="panel" hidden>
            <div class="panel__pestanas" role="tablist">
                <button id="pestana-miniaturas" class="panel__pestana" type="button" role="tab" aria-selected="true" data-i18n="panel.miniaturas"></button>

                <ul id="lista-anotaciones" class="anotaciones__lista"></ul>
            </div>
        </aside>

        <main id="visor" class="visor" tabindex="-1">
            <section id="portada" class="portada">
                <svg class="portada__icono" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
                <h1 data-i18n="portada.titulo"></h1>
                <p data-i18n="portada.texto"></p>

                <p class="portada__pista" data-i18n="portada.soltar"></p>

                    <button id="portada-escanear" class="boton-secundario" type="button" data-i18n="escanear.boton"></button>

                    <span data-i18n="motor.etiqueta"></span>

                <p class="portada__pie">
                    <span data-i18n="pie.licencia"></span> · <span id="version-app"></span>
                </p>
            </section>
            <div id="paginas" class="paginas" hidden></div>
        </main>

                    <button class="boton-icono" type="button" data-organizar="dividir" data-i18n-titulo="organizar.dividir">
                        <svg viewBox="0 0 24 24"><path d="M12 3v18M5 7l-3 5 3 5M19 7l3 5-3 5"/></svg>
                    </button>
                </div>
                <div class="barra__grupo barra__grupo--final">
                    <button class="boton-icono" type="button" data-organizar="deshacer" data-i18n-titulo="anotar.deshacer">
                        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
                    </button>
                    <button class="boton-icono" type="button" data-organizar="rehacer" data-i18n-titulo="anotar.rehacer">
                        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
                    </button>
                </div>
            </div>
            <p class="organizar__pista" data-i18n="organizar.pista"></p>
            <div id="organizar-cuadricula" class="organizar__cuadricula" role="listbox" aria-multiselectable="true"></div>
        </section>
    </div>

    <div id="zona-soltar" class="zona-soltar" hidden>
        <p data-i18n="portada.sueltaAqui"></p>
    </div>

    <dialog id="dialogo-clave" class="dialogo">
        <form id="formulario-clave" method="dialog">
            <h2 data-i18n="clave.titulo"></h2>
            <p data-i18n="clave.texto"></p>
            <input id="campo-clave" type="password" autocomplete="off" required data-i18n-titulo="clave.titulo">
            <p id="error-clave" class="dialogo__error" data-i18n="clave.error" hidden></p>
            <div class="dialogo__botones">
                <button id="clave-cancelar" type="button" value="cancelar" data-i18n="comun.cancelar"></button>
                <button class="boton-principal" type="submit" value="aceptar" data-i18n="comun.aceptar"></button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogo-progreso" class="dialogo">
        <p id="texto-progreso"></p>
        <progress id="barra-progreso" max="1" value="0"></progress>
        <div class="dialogo__botones">
            <button id="progreso-cancelar" type="button" data-i18n="comun.cancelar"></button>
        </div>
    </dialog>

    <dialog id="dialogo-actualizacion" class="dialogo">
        <h2 id="titulo-actualizacion" data-i18n="actualizador.titulo"></h2>
        <p data-i18n="actualizador.novedades"></p>
        <pre id="notas-actualizacion" class="dialogo__notas"></pre>
        <div id="progreso-actualizacion" hidden>
            <p data-i18n="actualizador.descargando"></p>
            <progress id="barra-actualizacion" max="1" value="0"></progress>
        </div>
        <div id="botones-actualizacion" class="dialogo__botones">
            <button id="actualizar-luego" type="button" data-i18n="actualizador.luego"></button>
            <button id="actualizar-ahora" class="boton-principal" type="button" data-i18n="actualizador.ahora"></button>
        </div>
    </dialog>

    <dialog id="dialogo-ajustes" class="dialogo">
        <h2 data-i18n="ajustes.titulo"></h2>
        <label class="dialogo__opcion">
            <input id="ajuste-avisar" type="checkbox" checked>
            <span data-i18n="ajustes.avisar"></span>
        </label>
        <div class="dialogo__botones">
            <button id="ajustes-cerrar" type="button" data-i18n="ajustes.cerrar"></button>
            <button id="ajustes-buscar" class="boton-principal" type="button" data-i18n="ajustes.buscar"></button>
        </div>
    </dialog>

    <dialog id="dialogo-texto" class="dialogo">
        <form id="formulario-texto" method="dialog">
            <h2 id="titulo-texto"></h2>
            <textarea id="campo-texto" class="dialogo__campo" rows="4"></textarea>
            <input id="campo-texto-linea" class="dialogo__campo" type="text" maxlength="40" hidden>
            <div class="dialogo__botones">
                <button id="texto-cancelar" type="button" data-i18n="comun.cancelar"></button>
                <button class="boton-principal" type="submit" data-i18n="comun.aceptar"></button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogo-crear" class="dialogo dialogo--ancho">
        <h2 data-i18n="organizar.crearTitulo"></h2>
        <p data-i18n="organizar.crearTexto"></p>
        <ol id="crear-lista" class="crear__lista"></ol>
        <div class="crear__pie">
            <button id="crear-anadir" type="button" data-i18n="organizar.anadirArchivos"></button>
            <label id="crear-modo-etiqueta" class="crear__modo">
                <span data-i18n="organizar.tamanoImagenes"></span>
                <select id="crear-modo">
                    <option value="a4" data-i18n="organizar.modoA4"></option>
                    <option value="imagen" data-i18n="organizar.modoImagen"></option>
                </select>
            </label>
        </div>
        <div class="dialogo__botones">
            <button id="crear-cancelar" type="button" data-i18n="comun.cancelar"></button>
            <button id="crear-aceptar" class="boton-principal" type="button" data-i18n="organizar.crear"></button>
        </div>
    </dialog>

    <dialog id="dialogo-dividir" class="dialogo">
        <form id="formulario-dividir" method="dialog">
            <h2 data-i18n="organizar.dividirTitulo"></h2>
            <label class="dialogo__opcion">
                <input type="radio" name="modo-dividir" value="rangos" checked>
                <span data-i18n="organizar.porRangos"></span>
            </label>
            <input id="dividir-rangos" class="dialogo__campo" type="text" inputmode="numeric" data-i18n-placeholder="organizar.ejemploRangos">
            <label class="dialogo__opcion">
                <input type="radio" name="modo-dividir" value="cada">
                <span data-i18n="organizar.cadaN"></span>
            </label>
            <input id="dividir-cada" class="dialogo__campo" type="number" min="1" value="1">
            <p id="dividir-error" class="dialogo__error" hidden></p>
            <div class="dialogo__botones">
                <button id="dividir-cancelar" type="button" data-i18n="comun.cancelar"></button>
                <button class="boton-principal" type="submit" data-i18n="organizar.dividir"></button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogo-recortar" class="dialogo dialogo--ancho">
        <h2 data-i18n="organizar.recortarTitulo"></h2>
        <p data-i18n="organizar.recortarTexto"></p>
        <div id="recortar-lienzo" class="recortar__lienzo">
            <canvas id="recortar-imagen"></canvas>
            <div id="recortar-marco" class="recortar__marco" hidden></div>
        </div>
        <label class="dialogo__opcion">
            <input id="recortar-todas" type="checkbox">
            <span data-i18n="organizar.recortarTodas"></span>
        </label>
        <div class="dialogo__botones">
            <button id="recortar-quitar" type="button" data-i18n="organizar.quitarRecorte"></button>
            <button id="recortar-cancelar" type="button" data-i18n="comun.cancelar"></button>
            <button id="recortar-aceptar" class="boton-principal" type="button" data-i18n="organizar.recortar"></button>
        </div>
    </dialog>

    <dialog id="dialogo-firma" class="dialogo dialogo--ancho">
        <h2 data-i18n="firmar.titulo"></h2>
        <section id="firma-guardadas" class="firma__seccion" hidden>
            <p class="firma__subtitulo" data-i18n="firmar.guardadas"></p>
            <ul id="firma-lista" class="firma__lista"></ul>
            <p class="firma__subtitulo" data-i18n="firmar.nueva"></p>
        </section>
        <div class="panel__pestanas firma__pestanas" role="tablist">
            <button class="panel__pestana" type="button" role="tab" data-firma-modo="dibujar" data-i18n="firmar.dibujar"></button>
            <button class="panel__pestana" type="button" role="tab" data-firma-modo="escribir" data-i18n="firmar.escribir"></button>
            <button class="panel__pestana" type="button" role="tab" data-firma-modo="subir" data-i18n="firmar.subir"></button>
        </div>
        <div data-firma-panel="dibujar">
            <canvas id="firma-lienzo" class="firma__lienzo"></canvas>
            <p class="firma__pista" data-i18n="firmar.pistaDibujar"></p>
        </div>
        <div data-firma-panel="escribir" hidden>
            <input id="firma-nombre" class="dialogo__campo" type="text" maxlength="60" autocomplete="name" data-i18n-placeholder="firmar.tuNombre">
            <div class="firma__letras">
                <button class="firma__letra" type="button" data-letra="DNNS Dancing"></button>
                <button class="firma__letra" type="button" data-letra="DNNS Great Vibes"></button>
                <button class="firma__letra" type="button" data-letra="DNNS Allura"></button>
            </div>
        </div>
        <div data-firma-panel="subir" hidden>
            <button id="firma-elegir" class="boton-secundario" type="button" data-i18n="firmar.elegirFoto"></button>
            <img id="firma-vista" class="firma__vista" alt="" hidden>
            <p class="firma__pista" data-i18n="firmar.pistaSubir"></p>
        </div>
        <div class="firma__pie">
            <div class="firma__tintas">
                <button class="firma__tinta firma__tinta--negra" type="button" data-tinta="#000000" data-i18n-titulo="firmar.tintaNegra"></button>
                <button class="firma__tinta firma__tinta--azul" type="button" data-tinta="#1a3a9e" data-i18n-titulo="firmar.tintaAzul"></button>
                <button id="firma-borrar" type="button" data-i18n="firmar.borrar"></button>
            </div>
            <label class="crear__modo">
                <input id="firma-recordar" type="checkbox" checked>
                <span data-i18n="firmar.recordar"></span>
            </label>
        </div>
        <div class="dialogo__botones">
            <button id="firma-cancelar" type="button" data-i18n="comun.cancelar"></button>
            <button id="firma-aceptar" class="boton-principal" type="button" data-i18n="firmar.colocar"></button>
        </div>
    </dialog>

    <dialog id="dialogo-certificado" class="dialogo">
        <form id="formulario-certificado" method="dialog" autocomplete="off">
            <h2 data-i18n="firmar.certTitulo"></h2>
            <p class="firma__pista" data-i18n="firmar.certPrivacidad"></p>
            <div class="cert__archivo">
                <button id="cert-elegir" class="boton-secundario" type="button" data-i18n="firmar.certElegir"></button>
                <span id="cert-nombre" class="cert__nombre"></span>
            </div>
            <label class="cert__etiqueta" for="cert-clave" data-i18n="firmar.certClave"></label>
            <div class="caja-clave">
                <input id="cert-clave" class="dialogo__campo" type="password" autocomplete="off">
                <button id="cert-ojo" class="caja-clave__ojo" type="button" aria-pressed="false" data-i18n-titulo="firmar.mostrarClave">
                    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div id="cert-datos" class="cert__datos" hidden></div>
            <label class="cert__etiqueta" for="cert-motivo" data-i18n="firmar.certMotivo"></label>
            <input id="cert-motivo" class="dialogo__campo" type="text" maxlength="120">
            <label class="cert__etiqueta" for="cert-lugar" data-i18n="firmar.certLugar"></label>
            <input id="cert-lugar" class="dialogo__campo" type="text" maxlength="80">
            <label class="dialogo__opcion">
                <input id="cert-visible" type="checkbox" checked>
                <span data-i18n="firmar.certVisible"></span>
            </label>
            <p id="cert-error" class="dialogo__error" hidden></p>
            <div class="dialogo__botones">
                <button id="cert-cancelar" type="button" data-i18n="comun.cancelar"></button>
                <button class="boton-principal" type="submit" data-i18n="firmar.certFirmar"></button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogo-verificar" class="dialogo dialogo--ancho">
        <h2 data-i18n="firmar.verTitulo"></h2>
        <p id="verificar-resumen"></p>
        <ul id="verificar-lista" class="verificar__lista"></ul>
        <p class="firma__pista" data-i18n="firmar.verNota"></p>
        <div class="dialogo__botones">
            <button id="verificar-cerrar" class="boton-principal" type="button" data-i18n="comun.aceptar"></button>
        </div>
    </dialog>

    <dialog id="dialogo-escanear" class="dialogo dialogo--pantalla">
        <div class="escanear" data-escanear-vista="camara">
            <div class="escanear__cabecera">
                <h2 data-i18n="escanear.titulo"></h2>
                <button id="escanear-cerrar" class="boton-icono" type="button" data-i18n-titulo="comun.cancelar">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div class="escanear__visor">
                <video id="escanear-video" class="escanear__video" autoplay playsinline muted></video>
                <p id="escanear-sin-camara" class="escanear__aviso" data-i18n="escanear.sinCamara" hidden></p>
            </div>
            <div class="escanear__paginas">
                <ol id="escanear-lista" class="escanear__lista"></ol>
                <span id="escanear-cuenta" class="escanear__cuenta" aria-live="polite"></span>
            </div>
            <div class="escanear__pie">
                <button id="escanear-foto" class="boton-secundario" type="button" data-i18n="escanear.elegirFoto"></button>
                <button id="escanear-capturar" class="escanear__disparador" type="button" data-i18n-titulo="escanear.capturar"></button>
                <select id="escanear-modo" data-i18n-titulo="organizar.tamanoImagenes">
                    <option value="a4" data-i18n="organizar.modoA4"></option>
                    <option value="imagen" data-i18n="organizar.modoImagen"></option>
                </select>
                <button id="escanear-terminar" class="boton-principal" type="button" disabled></button>
            </div>
        </div>
        <div class="escanear" data-escanear-vista="ajuste" hidden>
            <div class="escanear__cabecera">
                <h2 data-i18n="escanear.ajustar"></h2>
            </div>
            <div class="escanear__visor">
                <div class="escanear__marco">
                    <canvas id="escanear-lienzo"></canvas>
                    <svg id="escanear-esquinas" class="escanear__esquinas" preserveAspectRatio="none"></svg>
                </div>
            </div>
            <div class="escanear__filtros" role="group">
                <button type="button" data-filtro="mejorado" aria-pressed="true" data-i18n="escanear.filtroMejorado"></button>
                <button type="button" data-filtro="color" aria-pressed="false" data-i18n="escanear.filtroColor"></button>
                <button type="button" data-filtro="gris" aria-pressed="false" data-i18n="escanear.filtroGris"></button>
                <button type="button" data-filtro="texto" aria-pressed="false" data-i18n="escanear.filtroTexto"></button>
            </div>
            <div class="escanear__pie">
                <button id="escanear-repetir" class="boton-secundario" type="button" data-i18n="escanear.repetir"></button>
                <button id="escanear-usar" class="boton-principal" type="button" data-i18n="escanear.usar"></button>
            </div>
        </div>
    </dialog>

    <input id="entrada-foto" type="file" accept="image/*" hidden>
    <input id="entrada-certificado" type="file" accept=".p12,.pfx,application/x-pkcs12,application/octet-stream" hidden>
    <input id="entrada-firma" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <input id="entrada-varios" type="file" accept="application/pdf,.pdf,image/jpeg,image/png" multiple hidden>

    <dialog id="dialogo-confirmar" class="dialogo">
        <p id="texto-confirmar"></p>
        <div class="dialogo__botones">
            <button id="confirmar-cancelar" type="button" data-i18n="comun.cancelar"></button>
            <button id="confirmar-aceptar" class="boton-principal" type="button"></button>
        </div>
    </dialog>

    <div id="aviso" class="aviso" role="alert" hidden></div>

    <div id="banner-actualizacion" class="banner" hidden>
        <span data-i18n="actualizacion.texto"></span>
        <button id="boton-actualizar" type="button" data-i18n="actualizacion.boton"></button>
    </div>

    <div id="zona-impresion" class="zona-impresion"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
