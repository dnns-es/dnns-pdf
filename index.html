<!--
Fecha: 2026-10-12
Ruta: /index.html
Página principal de DNNS PDF
Barra de herramientas, panel lateral, visor de páginas y diálogos
Notas: los textos se rellenan desde i18n (data-i18n, data-i18n-titulo, data-i18n-placeholder).
       Los elementos con data-requiere-doc se desactivan mientras no hay documento abierto.
-->
<!doctype html>
<html lang="es" data-tema="claro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f6feb">
    <meta name="description" content="Editor de PDF libre y gratuito. Todo se procesa en tu dispositivo.">
    <title>DNNS PDF</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
    <header class="barra" role="toolbar">
        <div class="barra__grupo">
            <button id="boton-panel" class="boton-icono" type="button" data-i18n-titulo="barra.panel" data-requiere-doc>
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
            </button>
            <button id="boton-abrir" class="boton-icono" type="button" data-i18n-titulo="barra.abrir">
                <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            </button>
            <input id="entrada-archivo" type="file" accept="application/pdf,.pdf" hidden>
        </div>

        <div class="barra__grupo">
            <button id="boton-anterior" class="boton-icono" type="button" data-i18n-titulo="barra.anterior" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <input id="numero-pagina" class="barra__pagina" type="text" inputmode="numeric" value="" data-i18n-titulo="barra.irA" data-requiere-doc>
            <span id="total-paginas" class="barra__total"></span>
            <button id="boton-siguiente" class="boton-icono" type="button" data-i18n-titulo="barra.siguiente" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </button>
        </div>

        <div class="barra__grupo">
            <button id="boton-alejar" class="boton-icono" type="button" data-i18n-titulo="barra.alejar" data-requiere-doc>
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M20 20l-4.5-4.5"/></svg>
            </button>
            <select id="selector-zoom" class="barra__zoom" data-i18n-titulo="barra.zoom" data-requiere-doc>
                <option value="ancho" data-i18n="zoom.ancho"></option>
                <option value="pagina" data-i18n="zoom.pagina"></option>
                <option value="0.5">50 %</option>
                <option value="0.75">75 %</option>
                <option value="1">100 %</option>
                <option value="1.25">125 %</option>
                <option value="1.5">150 %</option>
                <option value="2">200 %</option>
                <option value="3">300 %</option>
                <option value="4">400 %</option>
                <option value="libre" hidden></option>
            </select>
            <button id="boton-acercar" class="boton-icono" type="button" data-i18n-titulo="barra.acercar" data-requiere-doc>
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M20 20l-4.5-4.5"/></svg>
            </button>
        </div>

        <div class="barra__grupo">
            <button id="boton-anotar" class="boton-icono" type="button" aria-pressed="false" data-i18n-titulo="anotar.boton" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
            </button>
        </div>

        <div class="barra__grupo barra__grupo--final">
            <button id="boton-buscar" class="boton-icono" type="button" data-i18n-titulo="barra.buscar" data-requiere-doc>
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            </button>
            <button id="boton-imprimir" class="boton-icono" type="button" data-i18n-titulo="barra.imprimir" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7"/></svg>
            </button>
            <button id="boton-descargar" class="boton-icono" type="button" data-i18n-titulo="barra.descargar" data-requiere-doc>
                <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
            </button>
            <button id="boton-ajustes" class="boton-icono" type="button" data-i18n-titulo="ajustes.boton" hidden>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </button>
            <button id="boton-tema" class="boton-icono" type="button" data-i18n-titulo="barra.tema">
                <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            </button>
            <select id="selector-idioma" class="barra__idioma" aria-label="Idioma / Language">
                <option value="es">ES</option>
                <option value="en">EN</option>
            </select>
        </div>
    </header>

    <div id="barra-anotar" class="barra-anotar" role="toolbar" hidden>
        <div class="barra__grupo">
            <button class="boton-icono" type="button" data-herramienta="seleccionar" data-i18n-titulo="anotar.herramientas.seleccionar">
                <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="resaltar" data-i18n-titulo="anotar.herramientas.resaltar">
                <svg viewBox="0 0 24 24"><path d="M9 15l-3 3h5l1-1M9 15l8-8 3 3-8 8z"/><path d="M3 21h18"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="subrayar" data-i18n-titulo="anotar.herramientas.subrayar">
                <svg viewBox="0 0 24 24"><path d="M7 4v6a5 5 0 0 0 10 0V4M5 20h14"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="tachar" data-i18n-titulo="anotar.herramientas.tachar">
                <svg viewBox="0 0 24 24"><path d="M16 6a4 3 0 0 0-8 1c0 4 8 3 8 7a4 3 0 0 1-8 1M4 12h16"/></svg>
            </button>
        </div>
        <div class="barra__grupo">
            <button class="boton-icono" type="button" data-herramienta="nota" data-i18n-titulo="anotar.herramientas.nota">
                <svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="texto" data-i18n-titulo="anotar.herramientas.texto">
                <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="lapiz" data-i18n-titulo="anotar.herramientas.lapiz">
                <svg viewBox="0 0 24 24"><path d="M3 17c3-6 5-8 7-5s3 3 5-1 4-4 6-2"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="rectangulo" data-i18n-titulo="anotar.herramientas.rectangulo">
                <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="circulo" data-i18n-titulo="anotar.herramientas.circulo">
                <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="linea" data-i18n-titulo="anotar.herramientas.linea">
                <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="flecha" data-i18n-titulo="anotar.herramientas.flecha">
                <svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>
            </button>
            <button class="boton-icono" type="button" data-herramienta="sello" data-i18n-titulo="anotar.herramientas.sello">
                <svg viewBox="0 0 24 24"><path d="M9 3h6v5l-1 4h5v4H5v-4h5L9 8zM5 20h14"/></svg>
            </button>
        </div>
        <div class="barra__grupo">
            <input id="color-anotar" class="barra-anotar__color" type="color" value="#e00000" data-i18n-titulo="anotar.color">
            <label class="barra-anotar__ajuste" data-i18n-titulo="anotar.grosor">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
                <input id="grosor-anotar" type="range" min="1" max="12" step="1" value="3">
            </label>
            <label class="barra-anotar__ajuste" data-i18n-titulo="anotar.opacidad">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16z"/></svg>
                <input id="opacidad-anotar" type="range" min="10" max="100" step="5" value="100">
            </label>
            <select id="tamano-anotar" class="barra__zoom" data-i18n-titulo="anotar.tamano">
                <option value="10">10</option>
                <option value="12">12</option>
                <option value="14" selected>14</option>
                <option value="18">18</option>
                <option value="24">24</option>
                <option value="36">36</option>
            </select>
            <select id="selector-sello" class="barra__zoom" data-i18n-titulo="anotar.herramientas.sello">
                <option value="APROBADO" data-i18n="anotar.sellos.aprobado"></option>
                <option value="REVISADO" data-i18n="anotar.sellos.revisado"></option>
                <option value="BORRADOR" data-i18n="anotar.sellos.borrador"></option>
                <option value="CONFIDENCIAL" data-i18n="anotar.sellos.confidencial"></option>
                <option value="URGENTE" data-i18n="anotar.sellos.urgente"></option>
                <option value="propio" hidden></option>
                <option value="personalizado" data-i18n="anotar.sellos.personalizado"></option>
            </select>
        </div>
        <div class="barra__grupo barra__grupo--final">
            <button id="boton-deshacer" class="boton-icono" type="button" data-i18n-titulo="anotar.deshacer" disabled>
                <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
            </button>
            <button id="boton-rehacer" class="boton-icono" type="button" data-i18n-titulo="anotar.rehacer" disabled>
                <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
            </button>
            <button id="boton-guardar" class="boton-icono" type="button" data-i18n-titulo="anotar.guardar">
                <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3M7 21v-7h10v7"/></svg>
            </button>
        </div>
    </div>

    <div id="barra-busqueda" class="busqueda" hidden>
        <input id="texto-busqueda" type="search" data-i18n-placeholder="busqueda.placeholder" data-i18n-titulo="busqueda.placeholder">
        <span id="contador-busqueda" class="busqueda__contador" aria-live="polite"></span>
        <button id="busqueda-anterior" class="boton-icono" type="button" data-i18n-titulo="busqueda.anterior">
            <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <button id="busqueda-siguiente" class="boton-icono" type="button" data-i18n-titulo="busqueda.siguiente">
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button id="busqueda-cerrar" class="boton-icono" type="button" data-i18n-titulo="busqueda.cerrar">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
    </div>

    <div class="cuerpo">
        <aside id="panel-lateral" class="panel" hidden>
            <div class="panel__pestanas" role="tablist">
                <button id="pestana-miniaturas" class="panel__pestana" type="button" role="tab" aria-selected="true" data-i18n="panel.miniaturas"></button>
                <button id="pestana-indice" class="panel__pestana" type="button" role="tab" aria-selected="false" data-i18n="panel.indice"></button>
                <button id="pestana-anotaciones" class="panel__pestana" type="button" role="tab" aria-selected="false" data-i18n="panel.anotaciones"></button>
            </div>
            <div id="lista-miniaturas" class="panel__contenido miniaturas" role="tabpanel"></div>
            <div id="lista-indice" class="panel__contenido indice" role="tabpanel" hidden>
                <p id="indice-vacio" class="indice__vacio" data-i18n="panel.sinIndice" hidden></p>
                <ul id="arbol-indice" class="indice__arbol"></ul>
            </div>
            <div id="lista-anotaciones-panel" class="panel__contenido anotaciones" role="tabpanel" hidden>
                <p id="anotaciones-vacio" class="indice__vacio" data-i18n="panel.sinAnotaciones" hidden></p>
                <ul id="lista-anotaciones" class="anotaciones__lista"></ul>
            </div>
        </aside>

        <main id="visor" class="visor" tabindex="-1">
            <section id="portada" class="portada">
                <svg class="portada__icono" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
                <h1 data-i18n="portada.titulo"></h1>
                <p data-i18n="portada.texto"></p>
                <button id="portada-abrir" class="boton-principal" type="button" data-i18n="portada.abrir"></button>
                <p class="portada__pista" data-i18n="portada.soltar"></p>
                <p class="portada__estado">
                    <span data-i18n="motor.etiqueta"></span>
                    <strong id="estado-motor" data-i18n="motor.cargando"></strong>
                </p>
                <p class="portada__pie">
                    <span data-i18n="pie.licencia"></span> · <span id="version-app"></span>
                </p>
            </section>
            <div id="paginas" class="paginas" hidden></div>
        </main>
    </div>

    <div id="zona-soltar" class="zona-soltar" hidden>
        <p data-i18n="portada.sueltaAqui"></p>
    </div>

    <dialog id="dialogo-clave" class="dialogo">
        <form id="formulario-clave" method="dialog">
            <h2 data-i18n="clave.titulo"></h2>
            <p data-i18n="clave.texto"></p>
            <input id="campo-clave" type="password" autocomplete="off" required data-i18n-titulo="clave.titulo">
            <p id="error-clave" class="dialogo__error" data-i18n="clave.error" hidden></p>
            <div class="dialogo__botones">
                <button id="clave-cancelar" type="button" value="cancelar" data-i18n="comun.cancelar"></button>
                <button class="boton-principal" type="submit" value="aceptar" data-i18n="comun.aceptar"></button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogo-progreso" class="dialogo">
        <p id="texto-progreso"></p>
        <progress id="barra-progreso" max="1" value="0"></progress>
        <div class="dialogo__botones">
            <button id="progreso-cancelar" type="button" data-i18n="comun.cancelar"></button>
        </div>
    </dialog>

    <dialog id="dialogo-actualizacion" class="dialogo">
        <h2 id="titulo-actualizacion" data-i18n="actualizador.titulo"></h2>
        <p data-i18n="actualizador.novedades"></p>
        <pre id="notas-actualizacion" class="dialogo__notas"></pre>
        <div id="progreso-actualizacion" hidden>
            <p data-i18n="actualizador.descargando"></p>
            <progress id="barra-actualizacion" max="1" value="0"></progress>
        </div>
        <div id="botones-actualizacion" class="dialogo__botones">
            <button id="actualizar-luego" type="button" data-i18n="actualizador.luego"></button>
            <button id="actualizar-ahora" class="boton-principal" type="button" data-i18n="actualizador.ahora"></button>
        </div>
    </dialog>

    <dialog id="dialogo-ajustes" class="dialogo">
        <h2 data-i18n="ajustes.titulo"></h2>
        <label class="dialogo__opcion">
            <input id="ajuste-avisar" type="checkbox" checked>
            <span data-i18n="ajustes.avisar"></span>
        </label>
        <div class="dialogo__botones">
            <button id="ajustes-cerrar" type="button" data-i18n="ajustes.cerrar"></button>
            <button id="ajustes-buscar" class="boton-principal" type="button" data-i18n="ajustes.buscar"></button>
        </div>
    </dialog>

    <dialog id="dialogo-texto" class="dialogo">
        <form id="formulario-texto" method="dialog">
            <h2 id="titulo-texto"></h2>
            <textarea id="campo-texto" class="dialogo__campo" rows="4"></textarea>
            <input id="campo-texto-linea" class="dialogo__campo" type="text" maxlength="40" hidden>
            <div class="dialogo__botones">
                <button id="texto-cancelar" type="button" data-i18n="comun.cancelar"></button>
                <button class="boton-principal" type="submit" data-i18n="comun.aceptar"></button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogo-confirmar" class="dialogo">
        <p id="texto-confirmar"></p>
        <div class="dialogo__botones">
            <button id="confirmar-cancelar" type="button" data-i18n="comun.cancelar"></button>
            <button id="confirmar-aceptar" class="boton-principal" type="button"></button>
        </div>
    </dialog>

    <div id="aviso" class="aviso" role="alert" hidden></div>

    <div id="banner-actualizacion" class="banner" hidden>
        <span data-i18n="actualizacion.texto"></span>
        <button id="boton-actualizar" type="button" data-i18n="actualizacion.boton"></button>
    </div>

    <div id="zona-impresion" class="zona-impresion"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
